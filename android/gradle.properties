android.useAndroidX=true
# 不需要 Jetifier：实测 terminal-view / terminal-emulator 两个 AAR 的 classes.jar 里
# `android/support` 出现 0 次，其余依赖（androidx.core / androidx.webkit /
# androidx.annotation）本来就是 androidx。开着它只会让每次构建多做一遍字节码重写。
#
# AGP 9 起 `android.useAndroidx` 本身也默认 true 了，这里保留是因为它无害且写明意图。
# 同一批默认值里还有两个**会改变语义**的，本项目已按新默认行事，记在这里免得回看时困惑：
#   android.builtInKotlin           false → true  （Kotlin 编译由 AGP 内置，不再要 KGP 插件）
#   android.newDsl                  false → true  （旧 DSL / 旧 Variant API 不再可用）
#   android.uniquePackageNames      false → true  （每个库必须有唯一包名）
#   android.sdk.defaultTargetSdkToCompileSdkIfUnset
#                                   false → true  （不写 targetSdk 就跟随 compileSdk；
#                                                 本项目显式写死 34，见 app/build.gradle.kts）
#   android.defaults.buildfeatures.resvalues / .shaders
#                                   true  → false （本项目两者都不用）
#
# 堆从 1536m 提到 2048m：内置 Kotlin 的编译跑在 Gradle daemon 进程里，不再像 KGP 那样
# 另起一个有独立堆的 Kotlin daemon，同一个 1536m 会紧。
org.gradle.jvmargs=-Xmx2048m
