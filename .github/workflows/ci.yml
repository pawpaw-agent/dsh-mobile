name: dsh-handheld CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/ci.yml'
      - 'scripts/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Terminal conformance gate: proves the differential test bed still works.
  # Runs first and needs no Android SDK — it is pure JVM, so it finishes in seconds
  # and a failure here means the corpus or the harness rotted, not the app.
  conformance:
    name: Terminal conformance harness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Run conformance gate (coverage + selftest + check)
        run: |
          cd android
          gradle :terminal-conformance:conformance --no-daemon

      # Invariant, not a nicety: terminal-conformance contains android.util /
      # android.graphics stand-ins so the reference emulator links on a plain JVM.
      # If it ever became an app dependency those stubs would collide with the real
      # framework classes, so the module must stay out of the APK's graph.
      - name: Verify the harness stays out of the app's dependency graph
        run: |
          cd android
          if gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon \
               | grep -q "terminal-conformance"; then
            echo "::error:::app must never depend on :terminal-conformance (android.* stubs would enter the APK)"
            exit 1
          fi
          echo "✓ :app does not depend on :terminal-conformance"

  # Behavioural test for the native pty layer. Needs no Android SDK and no NDK
  # download: the pty core is plain POSIX, so it runs on the runner's own compiler.
  # This is where fd leaks, SIGWINCH/window-size propagation and the exit-status
  # encoding are actually asserted — an Android cross-build can only prove it links.
  pty-test:
    name: Native pty host test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile and run the pty host test
        run: ./scripts/test-pty.sh

  build-dropbear:
    name: Build dropbear dbclient (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK (NDK)
        uses: android-actions/setup-android@v3

      - name: Locate NDK and build dbclient
        run: |
          ndk="$($ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
                 --list_installed | sed -E 's/( +[|] +)/|/g;s/ +$//' | \
                 grep '^  ndk' | cut -d '|' -f 4 | sort | head -n1)"
          echo "NDK: $ndk"
          ANDROID_NDK_HOME="$ANDROID_HOME/$ndk" ./scripts/build-dropbear.sh

      - name: Upload dbclient
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-arm64
          path: build-dropbear-output

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    # Gate the release artifact on the fast checks: there is no point producing an
    # APK if the terminal harness or the pty behaviour test already failed.
    needs: [build-dropbear, conformance, pty-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Pinned rather than discovered: the native build needs both an NDK and CMake,
      # and letting AGP guess means either a surprise download or an opaque
      # "NDK not configured" failure. The version is handed to Gradle through the
      # environment so the build script and this step cannot drift apart.
      - name: Install NDK and CMake for the native pty layer
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --install "ndk;25.1.8937393" "cmake;3.22.1" > /dev/null
          echo "ANDROID_NDK_VERSION=25.1.8937393" >> "$GITHUB_ENV"
          echo "installed ndk;25.1.8937393 cmake;3.22.1"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Fetch dropbear dbclient
        uses: actions/download-artifact@v4
        with:
          name: dropbear-arm64
          path: dbclient

      - name: Stage dbclient into app jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          install -m 0755 dbclient/dbclient android/app/src/main/jniLibs/arm64-v8a/libdbclient.so
          install -m 0755 dbclient/dropbearkey android/app/src/main/jniLibs/arm64-v8a/libdropbearkey.so
          cp dbclient/LICENSE.txt android/app/src/main/jniLibs/arm64-v8a/LICENSE-dropbear.txt 2>/dev/null || true
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      # 签名材料只在此步落地，构建后立即删除；绝不写入仓库。
      - name: Materialize release signing material
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::签名 secrets 缺失，release 将回退 debug 签名；该产物不可对外分发。"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # 硬校验：发布产物必须「不可调试」。debuggable=true 会让 `run-as` 无需 root
      # 即可读取应用私有目录（含经 Keystore 加密前的明文回退路径），并使 WebView
      # 远程调试对整个局域网开放。此步失败即构建失败，避免误发布。
      - name: Verify APK is not debuggable
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::未找到 release APK"; exit 1; }
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort | tail -n1)
          BADGE=$("$AAPT" dump badging "$APK" | grep -c "application-debuggable" || true)
          if [ "$BADGE" != "0" ]; then
            echo "::error::APK 是 debuggable 的，拒绝发布"
            "$AAPT" dump badging "$APK" | grep "application-debuggable"
            exit 1
          fi
          echo "✓ application-debuggable 不存在（不可调试）"
          "$AAPT" dump badging "$APK" | grep -E "^package|^application-label|sdkVersion|targetSdkVersion"

      # Hard check: the packaged pty library must be OUR build, not the upstream one
      # that also ships inside terminal-emulator's AAR. Both are called libtermux.so,
      # so "which one won" is decided by AGP's merge and cannot be assumed — the build
      # marker makes it a fact.
      - name: Verify the packaged pty library is the in-house build
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          rm -rf /tmp/apkx && mkdir -p /tmp/apkx
          unzip -o -q "$APK" 'lib/*/libtermux.so' -d /tmp/apkx
          SO="$(find /tmp/apkx -name libtermux.so | head -n1)"
          test -n "$SO" || { echo "::error::APK 内没有 libtermux.so"; exit 1; }
          if ! grep -qa "dsh-handheld-pty/" "$SO"; then
            echo "::error::libtermux.so 不含自研构建标记——pickFirsts 选中了 upstream 版本"
            exit 1
          fi
          echo "✓ libtermux.so 是自研 pty（含构建标记），$(stat -c%s "$SO") 字节"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-handheld-release
          path: android/app/build/outputs/apk/release/app-release.apk
