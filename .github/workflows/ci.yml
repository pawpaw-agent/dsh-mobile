name: dsh-handheld CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/ci.yml'
      - 'scripts/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Mobile adaptation contract gate. The app's whole value is "dsh's web UI on a
  # phone", and that adaptation rests entirely on dsh's DOM hooks (data-phase,
  # data-composer-input, …) which have NO version contract: dsh evolves on its
  # own, the plugin is vendored and pinned. If dsh renames one, the adaptation
  # silently breaks and you only find out on the phone.
  #
  # This job asserts the vendored plugin still reads exactly the hooks declared
  # in the committed contract, so re-vendoring cannot quietly widen our
  # dependency on unverified hooks. It is static (Node only, no browser, no
  # dsh install) and runs in seconds.
  #
  # The FULL check — proving each declared hook actually exists in the installed
  # dsh frontend — needs dsh present, so it runs on the machine that has dsh:
  #   node scripts/check-mobile-hooks.mjs
  # Run it after every dsh upgrade. See docs/mobile-ui-verification.md.
  mobile-contract:
    name: Mobile adaptation contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify plugin ⇄ contract agreement
        run: node scripts/check-mobile-hooks.mjs --contract

      - name: Verify the bootstrap template is the single source
        run: |
          # The injection bootstrap lives in assets and is read by BOTH the app
          # (MainActivity.mobileBootstrapJs) and the verification harness. If it
          # drifted back into a Kotlin raw string the harness would test
          # something the app does not run.
          test -f android/app/src/main/assets/plugins/mobile-bootstrap.js \
            || { echo "::error::mobile-bootstrap.js 缺失"; exit 1; }
          if grep -q 'Object.defineProperty(window, "__DSH_BOOT__"' \
               android/app/src/main/java/com/dshhandheld/app/MainActivity.kt; then
            echo "::error::MainActivity 里又出现了内联的注入脚本 —— 必须只从 assets 读取"
            exit 1
          fi
          echo "✓ 注入脚本只有 assets 一份"

  # Terminal conformance gate: proves the differential test bed still works.
  # Runs first and needs no Android SDK — it is pure JVM, so it finishes in seconds
  # and a failure here means the corpus or the harness rotted, not the app.
  conformance:
    name: Terminal conformance harness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        # 刻意不写 gradle-version：版本由 android/gradle/wrapper/gradle-wrapper.properties
        # 决定，`./gradlew` 自行下载。此前 CI 写死 8.5、wrapper 也写 8.5、本地脚本还调
        # 裸 `gradle` —— 三个出处，改一处就会静默漂移。

      - name: Run conformance gate (coverage + selftest + check)
        run: |
          cd android
          ./gradlew :terminal-conformance:conformance --no-daemon

      # Invariant, not a nicety: terminal-conformance contains android.util /
      # android.graphics stand-ins so the reference emulator links on a plain JVM.
      # If it ever became an app dependency those stubs would collide with the real
      # framework classes, so the module must stay out of the APK's graph.
      - name: Verify the harness stays out of the app's dependency graph
        run: |
          cd android
          if ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon \
               | grep -q "terminal-conformance"; then
            echo "::error:::app must never depend on :terminal-conformance (android.* stubs would enter the APK)"
            exit 1
          fi
          echo "✓ :app does not depend on :terminal-conformance"

  build-dropbear:
    name: Build dropbear dbclient (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK (NDK)
        uses: android-actions/setup-android@v3

      # 缓存按「构建脚本 + localoptions.h」的哈希取键：dropbear 版本号写在脚本里，
      # 脚本一改键就变，所以不会用旧产物冒充新版本。命中时省掉 clone + 交叉编译。
      - name: Cache dropbear build
        id: dropbear-cache
        uses: actions/cache@v4
        with:
          path: build-dropbear-output
          key: dropbear-${{ runner.os }}-${{ hashFiles('scripts/build-dropbear.sh', 'scripts/localoptions.h') }}

      - name: Locate NDK and build dbclient
        if: steps.dropbear-cache.outputs.cache-hit != 'true'
        run: |
          ndk="$($ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
                 --list_installed | sed -E 's/( +[|] +)/|/g;s/ +$//' | \
                 grep '^  ndk' | cut -d '|' -f 4 | sort | head -n1)"
          echo "NDK: $ndk"
          ANDROID_NDK_HOME="$ANDROID_HOME/$ndk" ./scripts/build-dropbear.sh

      - name: Report cache status
        run: |
          ls -la build-dropbear-output/
          if [ "${{ steps.dropbear-cache.outputs.cache-hit }}" = "true" ]; then
            echo "✓ 复用缓存的 dbclient（scripts/ 未变）"
          else
            echo "✓ 重新编译 dbclient"
          fi

      - name: Upload dbclient
        uses: actions/upload-artifact@v4
        with:
          name: dropbear-arm64
          path: build-dropbear-output

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    # Gate the artifact on the terminal harness: when it fails, terminal behaviour in
    # this tree is unverified, so there is no point producing an APK from it.
    needs: [build-dropbear, conformance, mobile-contract]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        # 版本来源同 conformance job：wrapper 是唯一出处。

      - name: Fetch dropbear dbclient
        uses: actions/download-artifact@v4
        with:
          name: dropbear-arm64
          path: dbclient

      - name: Stage dbclient into app jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          install -m 0755 dbclient/dbclient android/app/src/main/jniLibs/arm64-v8a/libdbclient.so
          install -m 0755 dbclient/dropbearkey android/app/src/main/jniLibs/arm64-v8a/libdropbearkey.so
          cp dbclient/LICENSE.txt android/app/src/main/jniLibs/arm64-v8a/LICENSE-dropbear.txt 2>/dev/null || true
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      # 签名材料只在此步落地，构建后立即删除；绝不写入仓库。
      - name: Materialize release signing material
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::签名 secrets 缺失，release 将回退 debug 签名；该产物不可对外分发。"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # 硬校验：发布产物必须「不可调试」。debuggable=true 会让 `run-as` 无需 root
      # 即可读取应用私有目录（含经 Keystore 加密前的明文回退路径），并使 WebView
      # 远程调试对整个局域网开放。此步失败即构建失败，避免误发布。
      - name: Verify APK is not debuggable
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::未找到 release APK"; exit 1; }
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort | tail -n1)
          BADGE=$("$AAPT" dump badging "$APK" | grep -c "application-debuggable" || true)
          if [ "$BADGE" != "0" ]; then
            echo "::error::APK 是 debuggable 的，拒绝发布"
            "$AAPT" dump badging "$APK" | grep "application-debuggable"
            exit 1
          fi
          echo "✓ application-debuggable 不存在（不可调试）"
          "$AAPT" dump badging "$APK" | grep -E "^package|^application-label|sdkVersion|targetSdkVersion"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-handheld-release
          path: android/app/build/outputs/apk/release/app-release.apk
